<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Соревнования по гребле</title>
    <script defer src="RowingGWT/RowingGWT.nocache.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }

        #mainContainer {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .gwt-Label-Title {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .gwt-Label-Status {
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f8f5;
            border-radius: 5px;
        }

        .gwt-Button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .gwt-Button:hover {
            background: #2980b9;
        }

        .gwt-TextBox, .gwt-ListBox {
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 3px;
            font-size: 14px;
        }

        .gwt-CellTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .gwt-CellTable th {
            background: #3498db;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .gwt-CellTable td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        .gwt-CellTable tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
<div id="mainContainer"></div>
</body>
</html>
